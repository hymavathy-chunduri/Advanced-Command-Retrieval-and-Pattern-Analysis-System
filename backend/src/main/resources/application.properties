# Linux Command Intelligence - Application Configuration

server.port=8080

# Database Configuration (Environment variable fallback default)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/linux_command_db}
spring.datasource.username=${DB_USERNAME:apple}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Atlas Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin:LinuxCmdPass123!@cluster0.ha3ezc1.mongodb.net/linux_command_db?retryWrites=true&w=majority}

# Logging Configuration
logging.level.root=INFO
logging.level.com.dsa.linuxintelligence=DEBUG
